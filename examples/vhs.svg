<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img"><title>load_switch</title>
<defs>
  <clipPath id="clip"><rect width="400" height="150" rx="8"/></clipPath>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd319"/><stop offset=".55" stop-color="#ff8a00"/><stop offset="1" stop-color="#ff2975"/></linearGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="400" height="150" fill="#0b0b0f"/>
  <g transform="skewX(-25)"><rect x="300" y="98" width="200" height="6" fill="#ff2975"/><rect x="304" y="106" width="200" height="6" fill="#ff8a00"/><rect x="308" y="114" width="200" height="6" fill="#ffd319"/><rect x="312" y="122" width="200" height="6" fill="#1fd1b2"/><rect x="316" y="130" width="200" height="6" fill="#3b82f6"/></g>
  <rect width="400" height="3" fill="#fff" fill-opacity=".06"><animate attributeName="y" values="-3;150" dur="4s" repeatCount="indefinite"/></rect>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fff">
  <text x="22" y="26">PLAY ▶<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.6;.6;1" dur="1.4s" repeatCount="indefinite"/></text>
  <text x="378" y="26" text-anchor="end">SP 00:20:03</text>
</g>
<g font-family="-apple-system, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif">
  <text x="22" y="64" font-size="30" font-weight="900" font-style="italic" fill="url(#chrome)" stroke="#fff" stroke-width=".8">load_switch</text>
  <text font-size="12" fill="#fff" fill-opacity=".75"><tspan x="22" y="88">A highly customizable toggle switch</tspan><tspan x="22" y="104">with a loading state.</tspan></text>
  <rect x="22" y="118" width="40" height="18" rx="2" fill="none" stroke="#fff"/>
  <text x="42" y="131" font-size="11" font-weight="900" font-style="italic" fill="#fff" text-anchor="middle">VHS</text>
  <text x="70" y="131" font-size="10" font-weight="700" fill="#fff" fill-opacity=".8" letter-spacing="1.5">HI-FI · DART</text>
</g>
</svg>