<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img"><title>load_switch</title>
<defs>
  <linearGradient id="hg-beam" x2="0" y2="1"><stop offset="0" stop-color="#4fd8ff" stop-opacity=".04"/><stop offset="1" stop-color="#4fd8ff" stop-opacity=".38"/></linearGradient>
  <linearGradient id="hg-panel" x2="0" y2="1"><stop offset="0" stop-color="#4fd8ff" stop-opacity=".16"/><stop offset="1" stop-color="#4fd8ff" stop-opacity=".06"/></linearGradient>
  <radialGradient id="hg-floor" cy=".9" r=".6"><stop offset="0" stop-color="#4fd8ff" stop-opacity=".22"/><stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/></radialGradient>
  <pattern id="hg-lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#4fd8ff" fill-opacity=".14"/></pattern>
  <clipPath id="hg-clip"><rect x="40" y="12" width="320" height="92" rx="4"/></clipPath>
  <filter id="hg-glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>@media (prefers-reduced-motion: no-preference) { .hg-flick{animation:hg-flick 5s linear infinite}.hg-scan{animation:hg-scan 2s linear infinite}.hg-beam{animation:hg-beam 3s ease-in-out infinite}
@keyframes hg-flick{0%,45%,48%,52%,88%,91%,100%{opacity:1}46%{opacity:.55}50%{opacity:.75}89.5%{opacity:.6}}@keyframes hg-scan{to{transform:translateY(4px)}}@keyframes hg-beam{50%{opacity:.7}} }</style>
<rect width="400" height="150" rx="12" fill="#030913"/>
<rect width="400" height="150" rx="12" fill="url(#hg-floor)"/>
<path class="hg-beam" d="M162 130L238 130L360 104L40 104Z" fill="url(#hg-beam)"/>
<g class="hg-flick">
  <rect x="40" y="12" width="320" height="92" rx="4" fill="url(#hg-panel)"/>
  <g clip-path="url(#hg-clip)"><rect class="hg-scan" x="40" y="4" width="320" height="104" fill="url(#hg-lines)"/></g>
  <rect x="40.5" y="12.5" width="319" height="91" rx="4" fill="none" stroke="#4fd8ff" stroke-opacity=".5"/>
  <path d="M40 24V12H52M348 12H360V24M360 92V104H348M52 104H40V92" fill="none" stroke="#bdf3ff" stroke-width="1.6"/>
  <g font-family="-apple-system, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" text-anchor="middle">
