    <text x="200" y="55" font-size="20" font-weight="700" fill="#4fd8ff" fill-opacity=".6" filter="url(#hg-glow)">load_switch</text>
    <text x="200" y="55" font-size="20" font-weight="700" fill="#e6fbff">load_switch</text>
    <text font-size="11" fill="#a8ecff"><tspan x="200" y="74">A highly customizable toggle switch with a</tspan><tspan x="200" y="88">loading state.</tspan></text>
  </g>
</g>
<ellipse cx="200" cy="131" rx="44" ry="6" fill="#0b2a3f" stroke="#4fd8ff" stroke-width="1.2"/>
<ellipse cx="200" cy="131" rx="30" ry="3.5" fill="#4fd8ff" fill-opacity=".55" filter="url(#hg-glow)"/>
<path d="M156 132L164 143H236L244 132" fill="#0d1b2a" stroke="#1f3b52"/>
<g fill="#00B4AB"><circle cx="186" cy="138" r="1.6"/><circle cx="200" cy="138" r="1.6"/><circle cx="214" cy="138" r="1.6"/></g>
