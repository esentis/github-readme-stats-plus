<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img"><title>load_switch</title>
<style>@media (prefers-reduced-motion: no-preference) { .ri-drift{animation:ri-drift 8s ease-in-out infinite}@keyframes ri-drift{0%,100%{transform:translate(2px,1.5px)}33%{transform:translate(3px,.6px)}66%{transform:translate(.8px,2.4px)}} }</style>
<defs>
  <style>.ink{mix-blend-mode:multiply}</style>
  <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="2.5" cy="2.5" r="1.8" fill="#0078bf"/></pattern>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .96  0 0 0 0 .94  0 0 0 0 .9  0 0 0 -2.4 1.3"/></filter>
  <clipPath id="clip"><rect width="400" height="150" rx="6"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="400" height="150" fill="#f5f0e6"/>
  <g class="ink ri-drift" fill="#ff48b0" transform="translate(2 1.5)">
    <circle cx="328" cy="62" r="54"/>
    <text x="22" y="46" font-family="-apple-system, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="24" font-weight="900">load_switch</text>
    <text x="22" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">★ 20  ⑂ 3</text>
  </g>
  <g class="ink" fill="#0078bf">
    <circle cx="354" cy="98" r="48" fill="url(#dots)"/>
    <text x="22" y="46" font-family="-apple-system, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill-opacity=".9">load_switch</text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5"><tspan x="22" y="70">A highly customizable toggle switch</tspan><tspan x="22" y="85">with a loading state.</tspan></text>
    <rect x="22" y="106" width="232" height="2.5"/>
    <circle cx="104.2" cy="125.5" r="4.5" fill="#00B4AB"/>
    <text x="112.2" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">Dart</text>
  </g>
  <rect width="400" height="150" filter="url(#grain)"/>
</g>
</svg>