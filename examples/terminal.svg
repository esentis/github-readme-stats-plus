<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img"><title>load_switch</title>
<defs>
  <clipPath id="clip"><rect width="400" height="150" rx="10"/></clipPath>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#clip)">
  <rect width="400" height="150" fill="#04170a"/>
  <rect width="400" height="22" fill="#0b2a14"/>
  <circle cx="14" cy="11" r="4" fill="#ff5f57"/><circle cx="28" cy="11" r="4" fill="#febc2e"/><circle cx="42" cy="11" r="4" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#39ff6a" filter="url(#glow)">
    <text x="18" y="48" font-size="15" font-weight="700">~/esentis $ cat load_switch</text>
    <text font-size="12" fill="#a7f3b8"><tspan x="18" y="74">A highly customizable toggle switch with a</tspan><tspan x="18" y="91">loading state.</tspan></text>
    <text x="18" y="124" font-size="12.5">lang=<tspan fill="#5eead4">dart</tspan> stars=<tspan fill="#fde047">20</tspan> forks=<tspan fill="#f9a8d4">3</tspan></text>
    <rect x="223" y="113" width="8" height="14" fill="#39ff6a"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
  <rect width="400" height="150" fill="url(#scan)"/>
</g>
</svg>