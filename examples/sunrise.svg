<style>@media (prefers-reduced-motion: no-preference) { .sr-sun{animation:sr-rise 10s ease-in-out infinite alternate}.sr-halo{transform-origin:318px 101px;animation:sr-breathe 5s ease-in-out infinite alternate}
.sr-wing{animation:sr-flap 1.3s ease-in-out infinite}
@keyframes sr-rise{to{transform:translateY(-9px)}}@keyframes sr-breathe{to{transform:scale(1.14);opacity:.75}}@keyframes sr-flap{50%{transform:scaleY(.3)}} }</style>
