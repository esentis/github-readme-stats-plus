  <radialGradient id="sr-sky" gradientUnits="userSpaceOnUse" cx="318" cy="101" r="330"><stop offset="0" stop-color="#ffe9b8"/><stop offset=".1" stop-color="#ffc27c"/><stop offset=".26" stop-color="#f2876c"/><stop offset=".48" stop-color="#b14f84"/><stop offset=".75" stop-color="#4d3378"/><stop offset="1" stop-color="#241d4c"/></radialGradient>
