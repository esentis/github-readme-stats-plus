<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img"><title>load_switch</title>
<style>@media (prefers-reduced-motion: no-preference) { .pf-ray { animation: pf-ray 7s ease-in-out infinite } @keyframes pf-ray { 0% { transform: translateX(-100px) } 45%, 100% { transform: translateX(100px) } } .pf-mist { transform-origin: 334px 36px; animation: pf-mist 9s ease-out infinite } @keyframes pf-mist { 0%, 61% { opacity: 0; transform: scale(.3) } 66% { opacity: .9 } 90%, 100% { opacity: 0; transform: translate(12px, -4px) scale(1.5) } } .pf-pump { animation: pf-pump 9s ease-in-out infinite } @keyframes pf-pump { 0%, 58%, 68%, 100% { transform: none } 62%, 64% { transform: translateY(2px) } } }</style>
