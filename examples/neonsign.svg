  <path d="M313 55Q309 92 400 90" fill="none" stroke="#0a0a0a" stroke-width="2.5"/>
</g>
<g font-family="-apple-system, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" stroke-linecap="round">
  <g>
    <text x="200" y="66" font-size="30" fill="none" stroke="#00B4AB" stroke-width="6" filter="url(#glow)">load_switch</text>
  <text x="200" y="66" font-size="30" fill="#fff" stroke="#00B4AB" stroke-width="2" stroke-linejoin="round" paint-order="stroke">load_switch</text>
